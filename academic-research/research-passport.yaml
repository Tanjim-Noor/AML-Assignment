      source_ids: ["DATA-STUDENT-AI", "NOTEBOOK-05"]
      destination: "Methods and Dataset Preparation"
    - claim_id: "CLAIM-BEST-MODEL"
      claim: "The tuned histogram gradient boosting model achieved test MAE 0.1112, RMSE 0.1414, and R-squared 0.4185."
      source_ids: ["NOTEBOOK-05", "EXPLANATION-05"]
      destination: "Abstract, Model Validation, Analysis, Conclusion"
    - claim_id: "CLAIM-AI-INCREMENT"
      claim: "The combined feature model achieved test R-squared 0.4170 compared with 0.2382 for context-only and 0.1703 for AI-only features."
      source_ids: ["NOTEBOOK-05", "EXPLANATION-05"]
      destination: "Abstract, Model Validation, Analysis, Conclusion"

