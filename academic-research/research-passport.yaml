research:
  approved_question: "To what extent do AI-usage variables improve out-of-sample prediction of semester GPA change beyond previous GPA and general study context, and which regression model provides the strongest validated performance?"
  scope:
    discipline: "Applied machine learning and generative AI in higher education"
    population: "Higher-education students represented by the supplied Kaggle modelling dataset"
    outcome: "Semester GPA change"
    objective_type: "Predictive and comparative, not causal"
    publication_years: "2016-2026, with emphasis on 2022-2026 for generative AI"
    language: "English"
    target_core_sources: "12-15"
  design:
    type: "Cross-sectional predictive modelling study"
    target: "GPA_Change = Post_Semester_GPA - Pre_Semester_GPA"
    evaluation: "80/20 development-test split with shuffled five-fold cross-validation inside development data"
    evidence_boundary: "Predictive associations within a provenance-opaque dataset; no causal or population-level inference"
  search_protocol:
    status: "executed-with-documented-degradation"
    databases:
      - "OpenAlex"
      - "Semantic Scholar"
      - "ERIC"
      - "Crossref"
    query_families:
      - "generative AI or ChatGPT and university academic performance"
      - "AI-use behaviour, prompt skill or digital literacy and student outcomes"
      - "machine learning prediction of GPA or academic achievement"
      - "exact Kaggle dataset title, filename and creator"
    corpus_approval_required: true
    included_core_sources: 15
    degradation:
      - "OpenAlex anonymous API search unavailable because of rate limiting/API-key requirement"
      - "Semantic Scholar Graph API returned HTTP 429; public result pages used for discovery"
      - "Kaggle kernel listing returned HTTP 401"
  corpus_version: "aml-report-corpus-v1"

